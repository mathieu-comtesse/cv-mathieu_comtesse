<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<base href="../" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>Le décor de Mathieu Comtesse</title>
<link rel="preload" href="monde3d/police/patrick-hand-sc.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family: "Lettrage"; src: url("monde3d/police/patrick-hand-sc.woff2") format("woff2"); font-display: swap; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e9dcc0; color: #2a2530; font: 400 18px/1.25 "Lettrage", "Trebuchet MS", sans-serif; letter-spacing: .03em; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .scene-controls { position: fixed; inset: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) auto max(12px, env(safe-area-inset-left)); display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .scene-controls[hidden] { display: none; }
  .scene-controls :is(a,button) { border: 1px solid #453d3c; background: #fbf7ec; color: #2a2530; font: 600 14px/1.2 system-ui, sans-serif; border-radius: 6px; padding: 10px 14px; min-height: 44px; box-sizing: border-box; display: inline-flex; align-items: center; cursor: pointer; }
  .scene-controls button[hidden] { display: none; }
  .scene-controls :focus-visible { outline: 3px solid #3328a4; outline-offset: 3px; }
  #pensee { transform-origin: 50% 100%; position: fixed; left: 0; top: 0; width: 186px; height: 155px; margin-top: -14px; opacity: 0; pointer-events: none; transition: opacity .25s; will-change: transform; }
  #pensee.vu { opacity: 1; }
  #pensee svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #pensee canvas { position: absolute; left: 50%; top: 14px; width: 84px; height: 84px; transform: translateX(-50%); }
  #pensee span { position: absolute; left: 30px; right: 30px; bottom: 36px; text-align: center; font-size: 15px; line-height: 1; }
  #pensee i { position: absolute; left: 50%; border-radius: 50%; background: #fbf7ec; border: 2px solid #2a2530; }
  #pensee i:nth-of-type(1) { width: 15px; height: 14px; bottom: -6px; margin-left: -4px; } #pensee i:nth-of-type(2) { width: 9px; height: 8px; bottom: -18px; margin-left: -12px; }
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="Le décor de Mathieu : il s'y déplace seul d'une activité à l'autre"></canvas>
<div id="pensee" aria-hidden="true"></div>
<nav class="scene-controls" aria-label="Commandes du décor" hidden>
  <a href="/">Retour au CV</a>
  <button type="button" hidden>Plein écran</button>
</nav>
<script type="module">
  if (window.self === window.top) {
    const controls = document.querySelector('.scene-controls');
    const screen = controls.querySelector('button');
    controls.hidden = false;
    if (document.fullscreenEnabled) {
      screen.hidden = false;
      screen.addEventListener('click', async () => {
        try {
          if (document.fullscreenElement) await document.exitFullscreen();
          else await document.documentElement.requestFullscreen();
        } catch {
          screen.hidden = true;
        }
      });
      document.addEventListener('fullscreenchange', () => {
        screen.textContent = document.fullscreenElement ? 'Quitter le plein écran' : 'Plein écran';
      });
    }
  }
</script>
<script type="module" src="monde3d/jeu/scene.js?v=d2"></script>
</body>
</html>
