<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>papercraft - structure types sampler</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #c9b27e; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); font: italic 14px/1.3 Georgia, 'Times New Roman', serif;
          color: #fff6e4; opacity: .85; letter-spacing: .03em; pointer-events: none; text-shadow: 0 1px 3px #5a3a20; }
</style>
<!-- "papercraft/" points at the folder that holds lib/ (and examples/): in your own project, wherever you copied them -->
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js", "papercraft/": "../../" } }</script>
</head>
<body>
<div class="hint" id="hint">structure types: click to fold flat and watch each one rise - drag to look around</div>
<!-- The STRUCTURE TYPES sampler (references/structures.md): one specimen of every type in placeholder outlines and
     prints, named on the page; not content. harness.js is the fixed harness; structures.js builds the specimens.
     Serve assets/ over http (npx serve assets) and open /templates/popup-3d/structures.html.
     ?capture ?walk ?mood=golden|dusk|night ?diag=key ?ss=2 -->
<script type="module" src="./structures.js"></script>
</body>
</html>
