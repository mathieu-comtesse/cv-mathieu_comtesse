<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>papercraft - pop-up world (Canvas 2D template)</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfc4a1; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .hint { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); font: italic 14px/1.3 Georgia, serif;
          color: #fff6e4; opacity: .85; letter-spacing: .03em; pointer-events: none; text-shadow: 0 1px 3px #5a3a20; }
</style>
<!-- "papercraft/" points at the folder that holds lib/ (and examples/): in your own project, wherever you copied them -->
<script type="importmap">{ "imports": { "papercraft/": "../../" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint" id="hint">arrows / WASD to walk - click to fold the world flat</div>
<!-- A pop-up world in Canvas 2D (no WebGL). harness-2d.js is the fixed harness (projection, sprites, shadows, lens,
     raised surfaces, walking, capture hook); scene.js is the countryside WORKED EXAMPLE: write your own scene.js with
     your own pieces. Serve assets/ over http (npx serve assets) and open /templates/popup-2d/.
     ?capture ?walk ?still ?view=x,z,zoom -->
<script type="module" src="./scene.js"></script>
</body>
</html>
