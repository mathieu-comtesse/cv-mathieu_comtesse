<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timber ! — scène interactive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@300;400;700&amp;family=VT323&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css?v=20260926-univ-ring"><style>
/* Mécanique des trains (gravures) et du curseur - inchangée. */
.railway{margin-top:0}
.rail-art{position:relative;width:100%;aspect-ratio:1997 / 787;background:#fff;mix-blend-mode:multiply;overflow:hidden;isolation:isolate;--rail-top:47.649301%}
.bridge-fixed{position:absolute;inset:0;width:100%;height:100%;max-width:none;z-index:3;clip-path:inset(47.395172% 0 0);pointer-events:none}
.train-runner{position:absolute;left:0;top:var(--rail-top);z-index:2;pointer-events:none;will-change:transform}
.train-runner[hidden]{display:none}
.train-window{position:relative;width:100%;height:100%;transform:translateY(-100%);overflow:hidden}
.train-window img{display:block;position:absolute;left:0;width:100%;max-width:none;height:auto}
.steam-passage{position:absolute;inset:0;z-index:2;clip-path:inset(0 0 52.604828%);pointer-events:none}
.steam-passage[hidden]{display:none}
.rail-art .steam-video{position:absolute;left:0;top:-1.85%;width:100%;height:auto;max-width:none;display:block;transform:none;mix-blend-mode:normal}
.tgv-sprite{width:125%;aspect-ratio:2172 / 166;transform:translate3d(-100%,0,0)}
.tgv-sprite img{top:-156.626506%}
html[data-theme="dark"] .rail-art{filter:invert(1) grayscale(1);mix-blend-mode:screen;opacity:.72}
html[data-theme="dark"] .rail-art .steam-video{filter:none;mix-blend-mode:normal;opacity:1}


/* Coins « ⌐ ¬ » : les blocs de bande gardent un peu d’air pour les marques d’angle. */
.band>.wrap.corners{padding-block:26px}
