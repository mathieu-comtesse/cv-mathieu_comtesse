<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Talas · Les sept ateliers</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080b0e;color:#ece9df;font-family:Georgia,serif}main{height:100%;display:grid;place-items:center;padding:0 0 42px}#game{width:min(100vw,calc((100vh - 42px)*16/9));aspect-ratio:16/9;position:relative}canvas{width:100%;height:100%;display:block;background:#080b0e;outline:0}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#080b0e;gap:18px;letter-spacing:.08em}progress{accent-color:#d6c2a2;width:min(260px,80vw);height:4px}footer{position:fixed;bottom:0;left:0;right:0;height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-top:1px solid #635a48;background:#101315;font-size:13px}button{font:inherit;color:inherit;border:1px solid #635a48;background:transparent;padding:5px 10px;cursor:pointer}#error{position:absolute;inset:20%;background:#141719;white-space:pre-wrap;padding:20px;display:none}svg{width:13px;height:13px;vertical-align:-2px;margin-right:5px}@media(max-width:450px){footer{padding:0 8px;font-size:11px}}
</style></head><body><main><div id="game"><canvas id="unity-canvas" width="1280" height="720" tabindex="0" aria-label="Jeu Talas"></canvas><div id="loading"><span>TALAS<br><small>Les sept ateliers</small></span><progress max="1" value="0"></progress><small id="loading-label">Chargement du quai…</small></div><div id="error" role="alert"></div></div></main><footer><span>Talas · ISO 45001</span><button id="fullscreen" aria-label="Passer en plein écran"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor"><path d="M6 1H1v5M10 1h5v5M1 10v5h5M15 10v5h-5"/></svg>Plein écran</button></footer>
<script src="Build/__LOADER__"></script><script>
const canvas=document.getElementById('unity-canvas');
function showError(message){const e=document.getElementById('error');e.textContent='Le jeu ne peut pas démarrer.\n'+message;e.style.display='block';document.getElementById('loading').style.display='none';}
createUnityInstance(canvas,{dataUrl:'Build/__DATA__',frameworkUrl:'Build/__FRAMEWORK__',codeUrl:'Build/__WASM__',streamingAssetsUrl:'StreamingAssets',companyName:'Talas',productName:'Talas — Les sept ateliers',productVersion:'0.2.0',autoSyncPersistentDataPath:true,devicePixelRatio:Math.min(window.devicePixelRatio,1.5),showBanner:(message,type)=>{if(type==='error')showError(message)}},p=>{document.querySelector('progress').value=p;document.getElementById('loading-label').textContent='Chargement '+Math.round(p*100)+' %';}).then(instance=>{document.getElementById('loading').style.display='none';document.getElementById('fullscreen').onclick=()=>instance.SetFullscreen(1);canvas.focus();}).catch(showError);
</script></body></html>
