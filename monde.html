<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1330;color:#e0ebfd;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;touch-action:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
#ui{position:fixed;inset:0;pointer-events:none}
#brand{position:absolute;left:max(18px,env(safe-area-inset-left));top:max(16px,env(safe-area-inset-top));display:grid;gap:2px}
#brand b{font:600 15px/1.2 Inter,system-ui,sans-serif;letter-spacing:-.01em}
#brand span{font:400 12px/1.3 ui-monospace,Consolas,monospace;letter-spacing:.06em;text-transform:uppercase;color:#8fa2d4}
#close{position:absolute;right:max(16px,env(safe-area-inset-right));top:max(14px,env(safe-area-inset-top));pointer-events:auto;color:#e0ebfd;text-decoration:none;font:500 13px/1 Inter,system-ui,sans-serif;padding:10px 14px;border-radius:10px;background:rgb(103 119 149 / .3);border:1px solid rgb(179 179 204 / .18);backdrop-filter:blur(10px)}
#close:hover{background:rgb(255 255 255 / .12)}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);font:400 12px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.04em;color:#8fa2d4;text-align:center;transition:opacity .6s}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font:500 13px/1 Inter,system-ui,sans-serif;letter-spacing:.01em;color:#fff;padding:6px 10px;border-radius:999px;background:rgb(10 16 40 / .55);border:1px solid rgb(179 179 204 / .22);backdrop-filter:blur(6px);transition:opacity .25s;will-change:transform,opacity}
#info{position:absolute;left:50%;bottom:calc(max(18px,env(safe-area-inset-bottom)) + 62px);transform:translateX(-50%);width:min(440px,calc(100% - 32px));display:grid;gap:4px;text-align:center;padding:12px 16px;border-radius:14px;background:rgb(10 16 40 / .72);border:1px solid rgb(179 179 204 / .2);backdrop-filter:blur(10px)}
#info b{font:600 15px/1.2 Inter,system-ui,sans-serif}
#info span{font:400 14px/1.45 Inter,system-ui,sans-serif;color:#b9c6e8}
#act{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);pointer-events:auto;cursor:pointer;font:600 14px/1 Inter,system-ui,sans-serif;color:#0b1330;background:#e0ebfd;border:0;border-radius:12px;padding:14px 22px;box-shadow:0 10px 30px rgb(0 0 0 / .35)}
#act:hover{background:#fff}
#act[hidden],#info[hidden]{display:none}
#stick{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:max(28px,env(safe-area-inset-bottom));width:116px;height:116px;border-radius:50%;background:rgb(255 255 255 / .06);border:1px solid rgb(179 179 204 / .28);pointer-events:auto;touch-action:none;display:none}
#stick i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:rgb(224 235 253 / .75)}
@media (pointer:coarse){#stick{display:block}#hint{display:none}#act{left:auto;right:max(20px,env(safe-area-inset-right));transform:none}#info{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 150px)}}
body:not(.ready) #hint{opacity:0}
noscript{position:fixed;inset:0;display:grid;place-items:center;background:#0b1330;color:#e0ebfd;padding:24px;text-align:center}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js","three/addons/":"./vendor/"}}</script>

<body>
<canvas id="c" aria-label="Île flottante à explorer : déplacez le personnage vers la forge, les portails ou la tirelire"></canvas>
<div id="ui">

  <a id="close" href="./" aria-label="Fermer et revenir à la pièce">Fermer</a>
  <div id="hint">ZQSD ou flèches pour marcher · clic pour aller quelque part · Entrée pour entrer</div>
  <div id="info" hidden></div>
  <button id="act" type="button" hidden></button>
  <div id="stick" aria-hidden="true"><i></i></div>
</div>
