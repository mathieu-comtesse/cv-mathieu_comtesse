<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sandboard — scène interactive</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@300;400;700&amp;family=VT323&amp;display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css?v=20260921-10"><style>
/* Mécanique des trains (gravures) et du curseur - inchangée. */
.railway{margin-top:0}
.rail-art{position:relative;width:100%;aspect-ratio:1997 / 787;background:#fff;mix-blend-mode:multiply;overflow:hidden;isolation:isolate;--rail-top:47.649301%}
.bridge-fixed{position:absolute;inset:0;width:100%;height:100%;max-width:none;z-index:3;clip-path:inset(47.395172% 0 0);pointer-events:none}
.train-runner{position:absolute;left:0;top:var(--rail-top);z-index:2;pointer-events:none;will-change:transform}
.train-runner[hidden]{display:none}
.train-window{position:relative;width:100%;height:100%;transform:translateY(-100%);overflow:hidden}
.train-window img{display:block;position:absolute;left:0;width:100%;max-width:none;height:auto}
.steam-passage{position:absolute;inset:0;z-index:2;clip-path:inset(0 0 52.604828%);pointer-events:none}
.steam-passage[hidden]{display:none}
.rail-art .steam-video{position:absolute;left:0;top:-1.85%;width:100%;height:auto;max-width:none;display:block;transform:none;mix-blend-mode:normal}
.tgv-sprite{width:125%;aspect-ratio:2172 / 166;transform:translate3d(-100%,0,0)}
.tgv-sprite img{top:-156.626506%}
html[data-theme="dark"] .rail-art{filter:invert(1) grayscale(1);mix-blend-mode:screen;opacity:.72}
html[data-theme="dark"] .rail-art .steam-video{filter:none;mix-blend-mode:normal;opacity:1}
/* Curseur : flèche croquis hachurée (49×62, inclinée de 22°, pointe en 1,0). Quand app.js active le calque « négatif » (.cursor-ghost), le curseur passe à la version « traits seuls » pour laisser voir l’inversion entre les hachures. */
:root{--cv-cursor:url("assets/cursor-sketch-1x.png") 1 0,auto;--cv-action:url("assets/cursor-sketch-1x.png") 1 0,pointer}@supports (cursor:image-set(url("assets/cursor-sketch-1x.png") 1x,url("assets/cursor-sketch-2x.png") 2x) 1 0,auto){:root{--cv-cursor:image-set(url("assets/cursor-sketch-1x.png") 1x,url("assets/cursor-sketch-2x.png") 2x) 1 0,auto;--cv-action:image-set(url("assets/cursor-sketch-1x.png") 1x,url("assets/cursor-sketch-2x.png") 2x) 1 0,pointer}}
html.has-ghost{--cv-cursor:url("assets/cursor-sketch-lines-1x.png") 1 0,auto;--cv-action:url("assets/cursor-sketch-lines-1x.png") 1 0,pointer}@supports (cursor:image-set(url("assets/cursor-sketch-lines-1x.png") 1x,url("assets/cursor-sketch-lines-2x.png") 2x) 1 0,auto){html.has-ghost{--cv-cursor:image-set(url("assets/cursor-sketch-lines-1x.png") 1x,url("assets/cursor-sketch-lines-2x.png") 2x) 1 0,auto;--cv-action:image-set(url("assets/cursor-sketch-lines-1x.png") 1x,url("assets/cursor-sketch-lines-2x.png") 2x) 1 0,pointer}}
@media (hover:hover) and (pointer:fine){
body{cursor:var(--cv-cursor)}
html body :is(a,button,summary,[role="button"],.scene-step,.scene-toggle,.theme-toggle),html body :is(a,button,summary,[role="button"]) *{cursor:var(--cv-action)}
html body :is(input,textarea,[contenteditable="true"]){cursor:text}
html body :is(button:disabled,[aria-disabled="true"]){cursor:not-allowed}
}


/* Coins « ⌐ ¬ » : les blocs de bande gardent un peu d’air pour les marques d’angle. */
.band>.wrap.corners{padding-block:26px}
</style></head><body class="scene-embed" data-page="sandboard" data-sand-engine="three"><main id="contenu" tabindex="-1">
<section class="band band--sandboard" id="sandboard">
  <div class="sandboard-stage sandboard-stage--full" id="sandboard-stage">
    <canvas id="sandboard-canvas" aria-label="Surface de sable 3D interactive"></canvas>
    <header class="sandboard-overlay"><span class="sandboard-kicker">Projet personnel · Three.js</span><h1>Dessiner dans le <em>sable.</em></h1><p>Creuser la surface avec le curseur : les grains se soulèvent, roulent et se déposent sur les rides.</p></header>
    <div class="sandboard-instructions"><span>Cliquer et glisser pour dessiner</span><span>Cliquer pour activer le son</span></div>
    <div class="sandboard-controls"><button id="sandboard-sound" type="button" aria-pressed="true">Son : oui</button><button class="sandboard-reset" type="button" id="sandboard-reset">Lisser le sable</button></div>
    <div class="sandboard-fallback" id="sandboard-fallback" hidden>La 3D n’est pas disponible sur ce navigateur.</div>
  </div>
</section>
</main><script type="module" src="sandboard.js?v=20260921-3"></script></body></html>
