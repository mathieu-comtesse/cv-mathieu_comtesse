5 14 6 8 9 2 6Z"/><path class="iso-swatch-crease" d="M2 4.5 8 7.5 14 4.5"/></svg>Cuves, de gauche à droite : CS, Locatif, MEC, PPTM, GLOBAL ; bac des alertes envoyées</span></span><span class="iso-caption">Chaque matin, les quatre flux et la vue globale comparent les dépenses aux fonds du compte : chaque périmètre envoie environ 6 alertes par semaine, soit 30 par semaine pour les cinq, préventives au seuil ou de dépassement (TND négatif) au-delà des fonds. Le bac montre la semaine en cours, sans bloquer les dépenses. Le pointage évité vaut 5 min par périmètre et par jour, soit 25 min : sur 225 jours, 93,75 h et environ 9 800 € par an à 104,74 €/h. Fonds et dépenses illustratifs.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

}
function iso([x, y, z], projection) {
    const { origin } = projection;
    const { sinA, cosA, sinE, cosE, k } = cameraOf(projection);
    return [origin[0] + (x * sinA - y * cosA) * k, origin[1] + ((x * cosA + y * sinA) * sinE - z * cosE) * k];
}
function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];
}

    const { sinA, cosA, sinE, cosE } = cameraOf(projection);
    return (x * cosA + y * sinA) * cosE + z * sinE;
}
const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
    return text === "-0" ? "0" : text;
};
function pathOf(points, closed = false) {
    if (!points.length)

}
const joinPaths = (paths) => paths.filter(Boolean).join("");
function roundedPlan({ x, y, w, d, r }, steps = 8) {
    const radius = Math.max(0, Math.min(r, w / 2, d / 2));
    const corners = [
        [x + w - radius, y + radius, -90],
        [x + w - radius, y + d - radius, 0],

        [x + radius, y + radius, 180],

    const out = [];

function signedArea(points) {

});
