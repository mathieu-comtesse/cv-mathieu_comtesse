an><span class="iso-caption">Une boîte à musique pour le Lecteur VRE. Le cylindre à picots est le modèle : la place de chaque picot est ce qu'il a appris. Le rapport PDF quitte la pile et entre dans le lecteur (Document AI) ; la manivelle fait tourner le cylindre, et chaque picot pince la lamelle de son champ, une couleur par champ (tri, mini-BERT). L'étouffoir, ce sont les règles métiers : il coupe les notes impossibles, le modèle et les règles jouent ensemble (hybride neuro-symbolique). Les douze cases du devant sont les pages inédites : le cylindre propose des cadres, jamais des certitudes. Chaque page sort par la bouche du flanc ; l'agent, la main de La Création d'Adam, la touche du bout de l'index sur la table lumineuse (Radiographie) : vert, validée ; rouge puis orange, corrigée. Elle part au corpus partagé, qui est ensuite scellé. Les copies du corpus figé servent à planter, un à un, les picots d'un cylindre neuf (entraînement LayoutLMv3, en local). Le banc d'essai le joue sur deux rapports séparés : il doit passer F1 0,75 et rappel U1 0,90. Seul un candidat accepté est publié, d'un coup de levier : l'ancien cylindre rejoint l'étagère des versions et le nouveau descend dans le boîtier. Le gain est littéral : une roue de 46 dents mène une roue de 20 dents, le cylindre tourne 46 / 20 = 2,3 fois plus vite.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
const ELEVATION = 30;
const SHADES = 4;
const RADIANS = Math.PI / 180;
const UNIT = Math.sqrt(1.6);
function cameraOf({ scale, azimuth = AZIMUTH, elevation = ELEVATION }) {

}
function iso([x, y, z], projection) {

function towardViewer(projection) {
    const { sinA, cosA } = cameraOf(projection);
    return [cosA, sinA];

function depthOf([x, y, z], projection) {
    const { sinA, cosA, sinE, cosE } = cameraOf(projection);

const tenth = (value) => {
    const text = (Math.round(value * 10) / 10).toFixed(1).replace(/\.0$/, "");
