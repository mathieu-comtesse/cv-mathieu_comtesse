ue l'eau des bassins perd en s'évaporant (92,8 kW à pleine occupation). Le débit d'air neuf est celui qui emporte cette eau, m = W / (x<sub>int</sub> − x<sub>ext</sub>) : 12 063 m³/h en janvier ; par jour lourd, l'air du dehors est plus humide que la halle et ne sèche plus rien. La fenêtre (U = 1,8 W/(m²·K)) reste au-dessus de la rosée par grand froid quand le soufflage la balaie (20,6 °C) ; sans balayage, sa surface tombe à 15,7 °C et la buée apparaît. Halle aux proportions exactes pour les bassins, coupée en façade.</span></figcaption></figure></main><script type="module">const AZIMUTH = 45;
