name: Scene smoke check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "tools/test-project-metadata.mjs"
      - "tools/test-jukebox-sequence.mjs"
      - "assets/dioramas/**"
      - "tools/test-native-geometry.mjs"
      - "tools/scene-test-profile.mjs"
      - "tools/test-v49-mobile-book.mjs"
      - "tools/test-v49-seat-book.mjs"
      - "tools/test-v49-features.mjs"
      - "tools/test-film-book-v50.mjs"
      - "tools/test-ps1-v50.mjs"
      - "assets/*-v50.*"
      - "style.css"
      - "tools/test-scene-runtime.mjs"
      - "tools/test-scene-lifecycle.mjs"
      - "tools/test-project-scroll.mjs"
      - "tools/test-annual-gains.mjs"
      - "tools/test-annual-gains-browser.mjs"
      - "project-dioramas.css"
      - "tools/test-motion-fit.mjs"
      - "tools/test-custom-scene.mjs"
      - "tools/test-user-room-props.mjs"
      - "assets/*-v43.glb"
      - "assets/*-v44.glb"
      - "assets/*-v43.mp3"
      - "assets/windows11-bloom-v43.webp"
      - "assets/gaming-desk-user-v42.glb"
      - "assets/jeans-baggy.glb"
      - "assets/nb992-fitted-v27.glb"
      - "assets/shoe-calibration-v27.json"
      - "shupi/assets/**"
      - ".github/workflows/scene-smoke.yml"
  workflow_dispatch:

concurrency:
  group: scene-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/project-dioramas.js
          node --check js/project-previews.js
          node --check js/personal-previews.js
          node --check js/process-symbols.js
          node --check js/conveyor-motion.js
          node --check js/process-highlight.js
          node --check js/process-machines.js
          node --check js/marquee.js
          node --check js/piggy-bank.js
          node --check js/annual-gains.js
          node --check js/projects-data.js
          node --check js/jukebox.js
          node --check js/kit.js
          node --check js/pages.js
          node --check js/data.js
          node --check js/home.js
          node --check js/main.js
          node --check js/room.js
          node --check js/film-album.js
          node --check js/paper-sheet.js
          node --check js/finance-emails.js
          node --check js/foliage.js
          node --check js/user-props.js
          node --check js/ps1-sound.js
          node --check js/info.js
          node --check js/furniture.js
          node --check js/desk-equipment.js
          node --check js/pump-sound.js
          node --check js/character.js
          node --check js/retro.js
          node --check js/native-room.js
          node --check js/native-geometry.js
          node --check js/thought.js
          node --check js/director.js
          node --check js/pond.js
          node --check js/chashitsu.js
          node --check js/ui.js
      - name: Check navigation around obstacles
        run: node tools/test-navigation.mjs
      - name: Check iframe geometry compatibility
        run: node tools/test-native-geometry.mjs
      - name: Check music sequencing
        run: node tools/test-jukebox-sequence.mjs
      - name: Check professional project metadata
        run: node tools/test-project-metadata.mjs
      - name: Check annual gain totals
        run: node tools/test-annual-gains.mjs
      - name: Check conveyor axes and transport
        run: node tools/test-conveyor-motion.mjs
      - name: Check suspended painting transforms
        run: node tools/test-static-transforms.mjs
      - name: Check scene entrypoints
        run: |
          set -euo pipefail
          grep -q "js/main.js?v=cv-scene-v50a" index.html
          grep -q "character.js?v=cv-scene-v49" js/room.js
          grep -q "retro.js?v=cv-scene-v50" js/room.js
          grep -q "room.js?v=cv-scene-v50a" js/main.js
          test -s assets/reference-character.glb
          test -s assets/seat-calibration-v26.json
          test -s assets/nb992-fitted-v27.glb
          test -s assets/shoe-calibration-v27.json
          grep -q "hero.poseSeatedL" js/room.js
          grep -q "retro.setPadHeld" js/room.js
  runtime:
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check mobile gestures and physical photo book
        run: node tools/test-v49-mobile-book.mjs
      - name: Check desk chair axis and page turns
        run: node tools/test-v49-seat-book.mjs
      - name: Check supplied props, power strip, foliage, PS1 sounds and financial emails
        run: node tools/test-v49-features.mjs
      - name: Check bound floating photo book
        run: node tools/test-film-book-v50.mjs
      - name: Check PS1 video timing and menu sounds
        run: node tools/test-ps1-v50.mjs
      - name: Check room rendering and interactions
        run: node tools/test-scene-runtime.mjs
      - name: Check supplied workstation, shelf props and PS1 cables
        run: node tools/test-user-room-props.mjs
      - name: Check greeting, autonomy, activity exits and particles
        run: node tools/test-scene-lifecycle.mjs
      - name: Check project images stay attached while scrolling
        run: node tools/test-project-scroll.mjs
      - name: Check piggy bank, calendar and saved years
        run: node tools/test-annual-gains-browser.mjs
      - name: Check original activities, effects and sounds
        run: node tools/test-motion-fit.mjs
      - name: Check customized furniture, props and motion
        run: node tools/test-custom-scene.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-runtime-captures
          path: test-results/
