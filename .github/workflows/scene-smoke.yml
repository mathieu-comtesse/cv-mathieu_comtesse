name: Scene smoke check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "tools/test-shujaat-geometry.mjs"
      - "tools/test-scene-runtime.mjs"
      - ".github/workflows/scene-smoke.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check js/room.js
          node --check js/character.js
          node --check js/retro.js
          node --check js/shujaat-room.js
          node --check js/shujaat-geometry.js
      - name: Check iframe geometry compatibility
        run: node tools/test-shujaat-geometry.mjs
      - name: Check scene entrypoints
        run: |
          set -euo pipefail
          grep -q "js/main.js?v=render-recovery-v10" index.html
          grep -q "character.js?v=heel-blender-v9" js/room.js
          grep -q "retro.js?v=heel-blender-v9" js/room.js
          grep -q "room.js?v=render-recovery-v10" js/main.js
          grep -q "const nbForwardOffset = { left: 0.226688, right: 0.223570 }" js/character.js
          grep -q "hero.poseSeatedL" js/room.js
          grep -q "retro.setPadHeld" js/room.js
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check room rendering and interactions
        run: node tools/test-scene-runtime.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-runtime-captures
          path: test-results/
