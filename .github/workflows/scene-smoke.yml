name: Scene smoke check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - ".github/workflows/scene-smoke.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/main.js
          node --check js/room.js
          node --check js/character.js
          node --check js/retro.js
          node --check js/shujaat-room.js
      - name: Check scene entrypoints
        run: |
          set -euo pipefail
          grep -q "js/main.js?v=heel-blender-v9" index.html
          grep -q "character.js?v=heel-blender-v9" js/room.js
          grep -q "retro.js?v=heel-blender-v9" js/room.js
          grep -q "room.js?v=heel-blender-v9" js/main.js
          grep -q "const nbForwardOffset = { left: 0.226688, right: 0.223570 }" js/character.js
          grep -q "hero.poseSeatedL" js/room.js
          grep -q "retro.setPadHeld" js/room.js
