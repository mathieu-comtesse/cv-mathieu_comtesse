name: Scene smoke check

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "js/**"
      - "tools/test-native-geometry.mjs"
      - "tools/scene-test-profile.mjs"
      - "tools/test-scene-runtime.mjs"
      - "tools/test-motion-fit.mjs"
      - "tools/test-custom-scene.mjs"
      - "assets/jeans-baggy.glb"
      - "shupi/assets/**"
      - ".github/workflows/scene-smoke.yml"
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/project-dioramas.js
          node --check js/project-previews.js
          node --check js/personal-previews.js
          node --check js/process-symbols.js
          node --check js/process-machines.js
          node --check js/projects-data.js
          node --check js/home.js
          node --check js/main.js
          node --check js/room.js
          node --check js/character.js
          node --check js/retro.js
          node --check js/native-room.js
          node --check js/native-geometry.js
          node --check js/thought.js
          node --check js/director.js
      - name: Check navigation around obstacles
        run: node tools/test-navigation.mjs
      - name: Check iframe geometry compatibility
        run: node tools/test-native-geometry.mjs
      - name: Check scene entrypoints
        run: |
          set -euo pipefail
          grep -q "js/main.js?v=cv-scene-v25" index.html
          grep -q "character.js?v=cv-scene-v25" js/room.js
          grep -q "retro.js?v=cv-scene-v25" js/room.js
          grep -q "room.js?v=cv-scene-v25" js/main.js
          test -s assets/reference-character.glb
          test -s assets/seat-calibration-v24.json
          grep -q "hero.poseSeatedL" js/room.js
          grep -q "retro.setPadHeld" js/room.js
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runtime
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Check room rendering and interactions
        run: node tools/test-scene-runtime.mjs
      - name: Check original activities, effects and sounds
        run: node tools/test-motion-fit.mjs
      - name: Check customized furniture, props and motion
        run: node tools/test-custom-scene.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scene-runtime-captures
          path: test-results/
