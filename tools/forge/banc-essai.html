<!doctype html>
<html lang="fr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forge Talas – banc d’essai</title>
<!-- Rendu dans les conditions du jeu : three r128 du même CDN, loadGLB extrait de village-talas-scene.html,
     dégradé toon 4 paliers, contour encre en coque inversée, lumières de l’île.
     Lancer depuis la racine du dépôt :  python -m http.server 8765  puis  http://localhost:8765/tools/forge/banc-essai.html -->
<style>
  html,body{margin:0;height:100%;background:#bfe3f2;font:14px system-ui;color:#2b2233;overflow:hidden}
  #ui{position:fixed;left:12px;top:12px;background:#fffaf0;border:2px solid #2b2233;border-radius:10px;padding:10px 12px;max-width:min(360px,calc(100vw - 48px))}
  #ui b{display:block;margin-bottom:4px}#ui label{display:block;margin:4px 0}#info{font-size:12px;color:#6b5a4a;margin-top:6px}
  canvas{display:block}
</style>
<div id="ui"><b>Forge Talas · banc d’essai</b>
  <label><input type="checkbox" id="pal"> Palette Talas (recoloration par rôle)</label>
  <label><input type="checkbox" id="out" checked> Contour encre</label>
  <div id="info">Chargement…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="../../talas-props.js"></script>
<script>
(async () => {
  const info = document.getElementById('info')
  // 1. le lecteur GLB du jeu, tel quel
  const html = await (await fetch('../../village-talas-scene.html')).text()
  const a = html.indexOf('function loadGLB(url)'), b = html.indexOf('return root})}', a) + 'return root})}'.length
  TalasProps.loadGLB = new Function(html.slice(a, b) + ';return loadGLB')()
  TalasProps.base = '../../assets/talas/props/'
  const cat = await (await fetch('catalogue.json')).json()
  const ids = cat.assets.map((x) => x.id)
  await TalasProps.preload(ids)

  // 2. scène aux réglages de l'île (HemisphereLight + DirectionalLight, cf. village-talas-scene.html)
  const r = new THREE.WebGLRenderer({ antialias: true }); r.setPixelRatio(Math.min(2, devicePixelRatio)); r.shadowMap.enabled = true
  document.body.appendChild(r.domElement)
  const s = new THREE.Scene(); s.background = new THREE.Color('#bfe3f2'); s.fog = new THREE.Fog('#bfe3f2', 30, 70)
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 400)
  s.add(new THREE.HemisphereLight('#e8f0ff', '#6b5a3a', 0.62))
  const sun = new THREE.DirectionalLight('#fff1d0', 0.7); sun.position.set(8, 14, 6); sun.castShadow = true
  sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 }); s.add(sun)
  const gcv = document.createElement('canvas'); gcv.width = 4; gcv.height = 1
  const gx = gcv.getContext('2d'); ['#8a8a8a', '#b8b8b8', '#e6e6e6', '#ffffff'].forEach((c, i) => { gx.fillStyle = c; gx.fillRect(i, 0, 1, 1) })
  const grad = new THREE.CanvasTexture(gcv); grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.generateMipmaps = false
  const ground = new THREE.Mesh(new THREE.CircleGeometry(24, 48), new THREE.MeshToonMaterial({ color: '#e9d8a6', gradientMap: grad }))
  ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; s.add(ground)

  // palette « Talas » : exemple de recoloration par rôle, plus vive que le gris-bleu de vibe3d
  const TALAS = { gris_clair: '#f1f3f5', gris_clair2: '#dee2e6', gris_clair3: '#ced4da', bleu_nuit: '#3a58b8', bleu_nuit2: '#2c3470', bleu_fonce: '#4a78d8', orange_fonce: '#ff8420', orange: '#ffa94d', brun: '#8a5a2b' }
  const holder = new THREE.Group(); s.add(holder)
  function layout() {
    holder.clear()
    const pal = document.getElementById('pal').checked ? TALAS : {}, outline = document.getElementById('out').checked ? 1.04 : 0
    const cols = Math.ceil(Math.sqrt(ids.length)), step = 4
    ids.forEach((id, i) => {
      const p = TalasProps.make(id, pal, { gradientMap: grad, outline }); if (!p) return
      const x = (i % cols - (cols - 1) / 2) * step, z = (Math.floor(i / cols) - (cols - 1) / 2) * step
      p.position.set(x, 0, z); holder.add(p)
    })
    info.textContent = `${ids.filter(TalasProps.loaded).length}/${ids.length} accessoires chargés par le loadGLB du jeu · glisser pour tourner, molette pour zoomer`
  }
  document.getElementById('pal').onchange = document.getElementById('out').onchange = layout
  layout()

  let yaw = 0.7, pitch = 0.55, dist = 30, drag = null
  addEventListener('pointerdown', (e) => { if (!e.target.closest('#ui')) drag = [e.clientX, e.clientY] })
  addEventListener('pointerup', () => (drag = null))
  addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.005; pitch = Math.min(1.4, Math.max(0.05, pitch + (e.clientY - drag[1]) * 0.005)); drag = [e.clientX, e.clientY] })
  addEventListener('wheel', (e) => { dist = Math.min(60, Math.max(4, dist * (1 + Math.sign(e.deltaY) * 0.1))) }, { passive: true })
  const size = () => { r.setSize(innerWidth, innerHeight); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix() }
  addEventListener('resize', size); size()
  ;(function loop() {
    cam.position.set(Math.sin(yaw) * Math.cos(pitch) * dist, Math.sin(pitch) * dist, Math.cos(yaw) * Math.cos(pitch) * dist); cam.lookAt(0, 0.8, 0)
    r.render(s, cam); requestAnimationFrame(loop)
  })()
})().catch((e) => { document.getElementById('info').textContent = 'Erreur : ' + e.message + ' (servir le dépôt en HTTP, pas en file://)' })
</script>
</html>
