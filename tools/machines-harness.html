<!doctype html><meta charset="utf-8"><title>Harnais machines</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.min.js","three/addons/":"../vendor/"}}</script>
<script type="module">
import * as THREE from 'three';
import { MACHINES, loadMachine, moduleName } from '../refonte/m3d/registry.js';
import { setDA } from '../refonte/m3d/core.js';
const finite = (g) => { let bad = 0; g.updateMatrixWorld(true); g.traverse((o) => { if (o.matrixWorld.elements.some((v) => !Number.isFinite(v))) bad++; if (o.geometry?.attributes?.position && !o.geometry.attributes.position.array.slice(0, 3000).every(Number.isFinite)) bad++; }); return bad; };
window.runMachines = async (only) => {
  const out = {};
  for (const name of Object.keys(MACHINES)) {
    if (only && only !== name) continue;
    const r = out[name] = { errors: [], notes: {} };
    try {
      const mod = await loadMachine(name); r.module = window.__cvMachineModules[name]; r.expected = MACHINES[name];
      setDA(name); const m = mod.build();
      const times = [0, 2.5, 6, 11.7, 19, 27, 36, 47, 61, 95, 130];
      for (const t of times) { m.update(t); const bad = finite(m.group); if (bad) r.errors.push('valeurs non finies à t=' + t + ' (' + bad + ')'); }
      const c = m.controls; r.notes.controls = c ? { seek: typeof c.seek, get: typeof c.get, set: typeof c.set } : null;
      if (c?.seek) { for (const v of [c.min, c.min + (c.step || 1) * Math.round((c.max - c.min) / 2 / (c.step || 1)), c.max]) { const t = c.seek(v); if (!Number.isFinite(t)) r.errors.push('seek(' + v + ') non fini'); m.update(t); const g = c.get(t); if (!Number.isFinite(g)) r.errors.push('get(seek(' + v + ')) non fini'); } }
      const a = m.api;
      if (a) {
        r.notes.views = a.views?.length || 0; r.notes.scenarios = a.scenarios?.length || 0;
        for (const v of a.views || []) if (!a.anchors?.[v.anchor]) r.errors.push('ancre de vue absente : ' + v.anchor);
        for (let i = 0; i < (a.scenarios?.length || 0); i++) { a.setScenario(i); for (const t of [0, 5, 12, 20, 33]) { m.update(t); if (finite(m.group)) r.errors.push('non fini, scénario ' + i + ' t=' + t); } }
        a.setScenario?.(null);
        if (a.setInspect) { a.setInspect(true); for (let k = 0; k < 40; k++) m.update(3 + k * .05); if (finite(m.group)) r.errors.push('non fini en inspection'); a.setInspect(false); for (let k = 0; k < 40; k++) m.update(5 + k * .05); if (finite(m.group)) r.errors.push('non fini au retour'); }
      }
      if (a?.frames) {   // machines à cadres déplaçables (Studio PDF) : positions, couverture, conformité, glisser
        a.setScenario(2); a.frames.reset(); if (!a.frames.coverage().ok) r.errors.push('cadrage par défaut non conforme');
        a.frames.move(1, a.frames.get(1).dx + 20, a.frames.get(1).dy + 10); const bad = a.frames.coverage(); if (bad.ok || bad.per[1] >= .8) r.errors.push('cadre déplacé mais couverture inchangée');
        for (const t of [16.2, 30, 45, 55, 60, 100, 150]) { m.update(t); if (finite(m.group)) r.errors.push('non fini, cadrage perso t=' + t); }
        a.frames.reset(); const f0 = a.frames.get(0), g0 = m.group; g0.updateMatrixWorld(true);
        const ray = (x, z) => new THREE.Ray(new THREE.Vector3(x, 100, z), new THREE.Vector3(0, -1, 0)), cx = -165 + f0.dx, cz = f0.dy;
        const hit = a.drag.pick(ray(cx, cz)); if (!hit || hit.id !== 0) r.errors.push('glisser : le cadre OT n\'est pas saisi (' + JSON.stringify(hit) + ')');
        else { a.drag.move(ray(cx + 6, cz)); const d = a.frames.get(0); if (Math.abs(d.dx - f0.dx - 6) > .01) r.errors.push('glisser : déplacement de ' + (d.dx - f0.dx)); a.drag.end(); }
        a.setScenario(0); if (a.drag.pick(ray(cx, cz))) r.errors.push('glisser actif hors du scénario Mon cadrage');
        a.frames.reset(); a.setScenario(null);
      }
      if (a?.params) {   // choix libres (Gares : critère et gare consultée) : l'état suit les choix, tout reste fini, le clic sur une rangée est saisi
        a.setScenario(2); const t0 = 100; m.update(t0); if (!a.params.visible()) r.errors.push('réglages non visibles dans Mon choix');
        a.params.groups[0].options[1].run(); a.params.groups[1].options[3].run(); const st1 = a.status();
        for (const dt of [1, 3, 6, 10, 14, 20, 30]) { m.update(t0 + dt); if (finite(m.group)) r.errors.push('non fini, Mon choix +' + dt); }
        if (a.params.groups[0].get() !== 1) r.errors.push('critère non retenu'); if (!/Conformité/.test(a.status()) || !/rang 4/.test(a.status())) r.errors.push('état inattendu : ' + a.status() + ' / ' + st1);
        const ray = (x, z, y) => new THREE.Ray(new THREE.Vector3(x, z, 200), new THREE.Vector3(0, 0, -1));
        m.group.updateMatrixWorld(true); const hitRow = a.drag.pick(ray(-77, 146 - 14.5 * 5)); if (!hitRow || hitRow.id !== 'row5') r.errors.push('clic rangée 6 non saisi : ' + JSON.stringify(hitRow));
        const c0 = a.params.groups[0].get(); a.drag.pick(ray(-112, 25)); if (a.params.groups[0].get() === c0) r.errors.push('clic sur la couronne sans effet');
        a.setScenario(0); if (a.drag.pick(ray(-77, 146))) r.errors.push('clic actif hors du scénario Mon choix'); a.setScenario(null);
      }
      let meshes = 0, geos = new Set(), mats = new Set(); m.group.traverse((o) => { if (o.isMesh) { meshes++; geos.add(o.geometry); [].concat(o.material).forEach((x) => mats.add(x)); } });
      r.notes.meshes = meshes; r.notes.geometries = geos.size; r.notes.materials = mats.size;
      if (!meshes) r.errors.push('aucun maillage');
      geos.forEach((g) => g.dispose()); mats.forEach((x) => x.dispose());
    } catch (e) { r.errors.push('exception : ' + (e?.stack || e).toString().slice(0, 300)); }
  }
  return out;
};
window.__ready = true;
</script>
