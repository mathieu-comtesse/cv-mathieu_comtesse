<!doctype html><meta charset="utf-8"><title>banc frame-bus</title><script src="../refonte/frame-bus.js"></script>
<script>window.busy=(ms)=>{const t=performance.now();while(performance.now()-t<ms);};window.loopBusy=0;(function f(){requestAnimationFrame(f);if(window.once){const m=window.once;window.once=0;busy(m);}if(window.loopBusy)busy(window.loopBusy);})();</script>
