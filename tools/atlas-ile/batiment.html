<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Banc des bâtiments</title>
<style>html,body{margin:0;height:100%;background:#123;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
/* Banc de contrôle d'un bâtiment seul : ?b=avignon&az=0.5&el=0.35&d=6&ty=1&nuit=0 — éclairage et post-traitement comme dans l'atlas. */
import * as THREE from '../../three.module.js';
import { creerRendu } from '../../atlas-rendu.js';
import { creerCiel } from '../../atlas-ciel.js';
import { chargerBatiments } from '../../atlas-batiments.js';
const q = new URLSearchParams(location.search), num = (k, d) => q.has(k) ? +q.get(k) : d;
const R = creerRendu(document.getElementById('c'), { qualite: 1 });
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(num('fov', 30), innerWidth / innerHeight, .1, 2000);
const ciel = creerCiel(R.renderer, scene); ciel.ocean.visible = false;
const soleil = new THREE.DirectionalLight('#fff0d4', 2.7); soleil.castShadow = true; soleil.shadow.mapSize.set(2048, 2048); soleil.shadow.bias = -.0005; soleil.shadow.normalBias = .02;
Object.assign(soleil.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 1, far: 60 }); scene.add(soleil, soleil.target);
const hemi = new THREE.HemisphereLight('#a6cdf2', '#cfdcea', .55); scene.add(hemi);
const sol = new THREE.Mesh(new THREE.CylinderGeometry(4.2, 4.2, .1, 64), new THREE.MeshStandardMaterial({ color: '#6a9f3e', roughness: 1 })); sol.position.y = -.05; sol.receiveShadow = true; scene.add(sol);
const B = await chargerBatiments(ciel);
const noms = (q.get('b') || 'avignon').split(','), esp = num('esp', 0); let groupe;
noms.forEach((n, i) => { const g = B.creer(n).groupe; g.position.x = (i - (noms.length - 1) / 2) * esp; scene.add(g); groupe = g; });
if (esp) { sol.scale.set(noms.length * esp / 8.4 + .5, 1, 1); }
R.dimensionner(innerWidth, innerHeight, 1); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
const az = num('az', .55), el = num('el', .3), d = num('d', 7), t = new THREE.Vector3(num('tx', 0), num('ty', 1), num('tz', 0));
camera.position.set(t.x + Math.sin(az) * Math.cos(el) * d, t.y + Math.sin(el) * d, t.z + Math.cos(az) * Math.cos(el) * d); camera.lookAt(t);
if (q.has('nuit')) { ciel.nuit(num('nuit', 0)); R.reglages.nuit = num('nuit', 0); }
soleil.position.copy(ciel.soleil).multiplyScalar(30); soleil.intensity = 2.7 * (1 - .92 * ciel.uniformes.uNuit.value); hemi.intensity = .55 * (1 - .8 * ciel.uniformes.uNuit.value);
R.reglages.eclat = .3;
for (let i = 0; i < 3; i++) { camera.updateMatrixWorld(); ciel.tick(.016, 3, camera); R.rendre(scene, null, camera, 3); }
window.__mats = (() => { const r = []; groupe.traverse(o => { if (o.isMesh) { const ms = Array.isArray(o.material) ? o.material : [o.material]; ms.forEach(m => { o.geometry.computeBoundingBox(); const bb = o.geometry.boundingBox; r.push(m.name + ' => ' + m.color.getHexString() + ' tris=' + (o.geometry.index.count/3) + ' bb=' + [bb.min.x,bb.min.y,bb.min.z,bb.max.x,bb.max.y,bb.max.z].map(v=>v.toFixed(1)).join(',')); }); } }); return r; })();
window.pret = true;
</script></body></html>
